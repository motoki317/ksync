apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-b
  namespace: team-a
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-b
  template:
    metadata:
      labels:
        app: api-b
    spec:
      containers:
        - name: api-b
          image: registry.example/api-b:1.0.0
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 64Mi
