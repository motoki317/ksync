apiVersion: apps/v1
kind: Deployment
metadata:
  name: twin
  namespace: a
spec:
  selector:
    matchLabels:
      app: twin
  template:
    metadata:
      labels:
        app: twin
    spec:
      containers:
        - name: twin
          image: registry.example/twin:1.0.0
