apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: registry.example/cache:1.0.0
      volumes:
        - name: cache-vol
          hostPath:
            path: /placeholder
            type: DirectoryOrCreate
