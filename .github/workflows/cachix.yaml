# Pre-build the flake package on every main/tag and push it to the cachix binary
# cache, so `nix run github:motoki317/ksync` and downstream `nix develop`s that
# depend on ksync substitute the binary instead of compiling it.
#
# Requires the repo secret CACHIX_AUTH_TOKEN (a write token for the
# motoki317-ksync cache). Until that secret and the cache exist, this workflow
# builds successfully but cannot push.
name: cachix

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest # x86_64-linux
          - ubuntu-24.04-arm # aarch64-linux
          - macos-latest # aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: motoki317-ksync
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .#ksync --print-build-logs
