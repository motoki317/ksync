name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Run the project's commit gate (build + gofmt + vet + go test) inside the
      # devShell rather than raw-go: the render byte-parity tests shell out to the
      # flake-pinned helm/kustomize, so a CI without them would skip those tests
      # (binary absent) or fail on version skew. --accept-flake-config opts into the
      # flake's cachix substituters once they are configured (no-op until then).
      - run: nix develop --accept-flake-config -c just pre-commit
      # Race detector on top of the commit gate: catches data races the plain
      # `go test` cannot. Separate from pre-commit so local commits stay fast.
      - run: nix develop --accept-flake-config -c just test-race
