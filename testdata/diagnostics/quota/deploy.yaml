# A ResourceQuota capping pods at zero means the Deployment's ReplicaSet can never
# create a pod: there is no pod to diagnose, and the only actionable signal is the
# FailedCreate warning on the ReplicaSet — the "no child pod" failure class.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: block-pods
spec:
  hard:
    pods: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota
spec:
  replicas: 1
  selector:
    matchLabels: { app: quota }
  template:
    metadata:
      labels: { app: quota }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
