apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness
spec:
  replicas: 1
  selector:
    matchLabels: { app: readiness }
  template:
    metadata:
      labels: { app: readiness }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
